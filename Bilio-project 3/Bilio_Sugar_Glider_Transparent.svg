    <mask id="glider-eye-openings" x="0" y="0" width="244.85" height="181.98" maskUnits="userSpaceOnUse" style="mask-type: luminance">
      <rect width="244.85" height="181.98" fill="white"/>
      <g fill="black"><g class="blink left"><g transform="translate(109.93 40.82) scale(0.1559649437) translate(-668.3 -255.6)"><use href="#bilio-eye-dot"/></g></g><g class="blink right"><g transform="translate(134.86 40.82) scale(0.1559649437) translate(-668.3 -255.6)"><use href="#bilio-eye-dot"/></g></g></g>
      <g fill="white"><g class="blink left"><g transform="translate(111.18 40.53) scale(0.1053478805) translate(-668.3 -255.6)"><use href="#bilio-eye-dot"/></g></g><g class="blink right"><g transform="translate(133.67 40.53) scale(0.1053478805) translate(-668.3 -255.6)"><use href="#bilio-eye-dot"/></g></g></g>
    </mask>
  </defs>
